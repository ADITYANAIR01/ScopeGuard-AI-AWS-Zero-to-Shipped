name: ScopeGuard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ASG_NAME: scopeguard-asg
  APP_URL: https://scopeguard.adityanair.tech
  NODE_VERSION: "22"

jobs:
  ci:
    name: lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: rolling deploy (ASG instance refresh)
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start instance refresh (new instances git-pull main on boot)
        run: |
          set -euo pipefail
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"MaxHealthyPercentage":100,"SkipMatching":false,"AutoRollback":true}' \
            --query 'InstanceRefreshId' --output text --region "$AWS_REGION")
          echo "REFRESH_ID=$REFRESH_ID" >> "$GITHUB_ENV"
          echo "Started refresh $REFRESH_ID on $ASG_NAME"

      - name: Wait for refresh (max ~20 min)
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --query 'InstanceRefreshes[0].Status' --output text --region "$AWS_REGION")
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled) echo "Refresh $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for instance refresh"; exit 1

      - name: Verify ALB + app
        run: |
          set -euo pipefail
          curl -fsS -m 20 -o /dev/null -w "root:%{http_code}\n" "$APP_URL/"
          curl -fsS -m 20 -o /dev/null -w "dashboard:%{http_code}\n" "$APP_URL/dashboard"
          RESP=$(curl -fsS -m 60 -X POST "$APP_URL/api/analyze" \
            -F "contractText=SOW: Build landing page. Fixed price." \
            -F "clientRequest=Also build mobile app urgently")
          echo "$RESP" | head -c 300; echo ""
          echo "$RESP" | grep -q '"isScopeCreep"' || { echo "Smoke test failed"; exit 1; }
          echo "DEPLOY OK"
